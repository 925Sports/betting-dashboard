name: Update NFL Props

on:
  workflow_dispatch:
  schedule:
    - cron: "10,40 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard from sheets + Kalshi
        env:
          HOURS_AHEAD: "360"
        run: python scripts/fetch_board.py

      - name: Pull NFL news / injuries / game logs
        run: python scripts/fetch_nfl_intel.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh NFL props from sheet $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
