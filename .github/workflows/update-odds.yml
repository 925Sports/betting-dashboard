name: Update NFL Props

on:
  workflow_dispatch:
  schedule:
    - cron: "10,40 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build dashboard from published Google Sheet
        env:
          SHEET_CSV: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS2Fdvk-56Bf-fiq8ETUftpL1W8cTqtfiOJJSehCXU60lMyo7W4_ldiGJuMrnydlZwM9fBvdrgx6VqQ/pub?gid=0&single=true&output=csv"
          HOURS_AHEAD: "360"
        run: python scripts/fetch_nfl_props.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nfl-props.json data/meta.json
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: refresh NFL props from sheet $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
