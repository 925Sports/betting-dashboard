<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>+EV Betting Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>+EV BETTING DASHBOARD</h1>
        <div class="sub" id="updated">Loading…</div>
      </div>
      <div class="sub" id="count"></div>
    </div>

    <div class="filters">
      <select id="game"></select>
      <select id="stat"></select>
      <select id="side">
        <option value="">Over / Under</option>
        <option value="Over">Over</option>
        <option value="Under">Under</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>
      <label class="chk"><input type="checkbox" id="evOnly" /> +EV only (≥54%)</label>
      <label class="chk">Min % <input type="number" id="minPct" value="0" min="0" max="100" step="0.5" style="width:72px" /></label>
      <input type="search" id="q" placeholder="Search players…" />
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="player">Player</th>
            <th data-key="stat">Stat</th>
            <th data-key="line">Line</th>
            <th data-key="pct_to_hit">% to Hit</th>
            <th data-key="ev">Edge</th>
            <th>PP</th>
            <th>UD</th>
            <th>DK</th>
            <th>FD</th>
            <th>MGM</th>
            <th>CZR</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No rows match these filters.</div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
