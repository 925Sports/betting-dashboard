<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>+EV Betting Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="logo">925</span>
      <div>
        <div class="brand-title">+EV Optimizer</div>
        <div class="brand-sub">NFL player props</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab on" data-view="pp" type="button">PrizePicks</button>
      <button class="tab" data-view="ud" type="button">Underdog</button>
      <button class="tab" data-view="ev" type="button">+EV Only</button>
      <button class="tab" data-view="all" type="button">All Props</button>
    </nav>
    <div class="meta" id="updated">Loading…</div>
  </header>

  <div class="wrap">
    <div class="filters">
      <div class="chip">NFL</div>
      <select id="game"></select>
      <select id="stat"></select>
      <select id="side">
        <option value="ou">Over / Under</option>
        <option value="Over">Over</option>
        <option value="Under">Under</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
        <option value="all">All sides</option>
      </select>
      <label class="chk">Min % <input type="number" id="minPct" value="50" min="0" max="100" step="0.5" /></label>
      <input type="search" id="q" placeholder="Search players…" />
      <div class="count" id="count"></div>
    </div>

    <div class="books-bar">
      <div class="books-label">Books</div>
      <div class="books-picks" id="bookPicks"></div>
      <button type="button" class="tab" id="booksReset">Default books</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="headrow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No rows match these filters.</div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
