<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>+EV Betting Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="loader" class="loader">
    <div class="field">
      <div class="yard"></div>
      <div class="football" aria-hidden="true">
        <span class="laces"></span>
      </div>
    </div>
    <div class="loader-brand">925</div>
    <div class="loader-title">+EV Optimizer</div>
    <div class="loader-sub" id="loaderText">Warming up the slate…</div>
    <div class="loader-bar"><span></span></div>
  </div>

  <header class="bar">
    <div class="brand">
      <span class="logo">925</span>
      <div>
        <div class="brand-title">+EV Optimizer</div>
        <div class="brand-sub">All sports · PP Standard</div>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab on" data-view="pp" type="button">PrizePicks</button>
      <button class="tab" data-view="ud" type="button">Underdog</button>
      <button class="tab" data-view="pick6" type="button">Pick6</button>
      <button class="tab" data-view="prophetx" type="button">ProphetX</button>
      <button class="tab" data-view="novig" type="button">Novig</button>
      <button class="tab" data-view="ev" type="button">+EV Only</button>
      <button class="tab" data-view="all" type="button">All Props</button>
    </nav>
    <div class="meta" id="updated">Loading…</div>
  </header>

  <div class="wrap">
    <div class="filters">
      <select id="sport">
        <option value="all" selected>All sports</option>
        <option value="nfl">NFL</option>
        <option value="cfb">CFB</option>
        <option value="mlb">MLB</option>
        <option value="soccer">Soccer</option>
        <option value="wnba">WNBA</option>
        <option value="nba">NBA</option>
        <option value="cbb">CBB</option>
        <option value="nhl">NHL</option>
      </select>
      <select id="section">
        <option value="props">Player props</option>
        <option value="games">Game lines</option>
      </select>
      <select id="game"></select>
      <select id="stat"></select>
      <select id="side">
        <option value="ou">Over / Under</option>
        <option value="Over">Over</option>
        <option value="Under">Under</option>
        <option value="Yes">Yes</option>
        <option value="No">No</option>
        <option value="all">All sides</option>
      </select>
      <select id="tier">
        <option value="standard">PP Standard</option>
        <option value="all">All PP lines</option>
        <option value="demon">Demons</option>
        <option value="goblin">Goblins</option>
      </select>
      <select id="picks">
        <option value="2">PP 2-Pick (BE 57.7%)</option>
        <option value="3">PP 3-Pick (BE 58.5%)</option>
        <option value="4">PP 4-Pick (BE 56.2%)</option>
        <option value="5" selected>PP 5-Pick (BE 54.9%)</option>
        <option value="6">PP 6-Pick (BE 54.1%)</option>
      </select>
      <label class="chk">Min % <input type="number" id="minPct" value="50" min="0" max="100" step="0.5" /></label>
      <input type="search" id="q" placeholder="Search players…" />
      <div class="count" id="count"></div>
    </div>

    <div class="books-bar">
      <div class="books-label">Books</div>
      <div class="books-picks" id="bookPicks"></div>
      <button type="button" class="tab" id="booksReset">Default books</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="headrow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No rows match these filters.</div>
    </div>

    <div class="slip-bar" id="slipBar" hidden>
      <div class="slip-label">PP slip <span id="slipCount">0</span></div>
      <div class="slip-picks" id="slipPicks"></div>
      <a class="tab on" id="slipOpen" href="https://app.prizepicks.com/" target="_blank" rel="noopener">Open in PrizePicks</a>
      <button type="button" class="tab" id="slipClear">Clear</button>
    </div>

    <div class="table-wrap" id="gamesWrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Game</th>
            <th>Spread</th>
            <th>Total</th>
            <th>ML Away</th>
            <th>ML Home</th>
            <th>Kalshi ML</th>
            <th>Kalshi Spread</th>
            <th>Kalshi Total</th>
            <th>Best Edge</th>
          </tr>
        </thead>
        <tbody id="gamesBody"></tbody>
      </table>
      <div class="empty" id="gamesEmpty" style="display:none">No game lines yet. Run the Action.</div>
    </div>
  </div>
  <div id="popup" class="popup" hidden>
    <div class="popup-card" id="popupCard"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
